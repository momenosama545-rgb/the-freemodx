<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">FreeModX - أفضل تطبيقات، ألعاب وكونفجات معدلة</title>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-secondary: #666666;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --border-color: #e5e7eb;
            --header-bg: #ffffff;
            --hero-bg: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --hero-text: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --border-color: #334155;
            --header-bg: #1e293b;
            --hero-bg: linear-gradient(135deg, #312e81 0%, #4c1d95 100%);
            --hero-text: #f8fafc;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header & Navbar */
        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .navbar .nav-item {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 6px;
        }

        .navbar .nav-item:hover, .navbar .nav-item.active {
            color: var(--primary-color);
            background-color: rgba(79, 70, 229, 0.1);
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* Hero Section */
        .hero {
            background: var(--hero-bg);
            color: var(--hero-text);
            padding: 3rem 2rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 900;
        }

        .hero p {
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto 1.5rem auto;
            opacity: 0.9;
        }

        /* Main Container & Filters */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem 3rem 2rem;
            flex: 1;
            width: 100%;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        /* Apps Grid & Cards */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .app-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .app-header {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 12px;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        .app-info h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .app-version {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .app-features {
            font-size: 0.9rem;
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .app-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            line-height: 1.4;
            flex-grow: 1;
        }

        .app-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            gap: 10px;
        }

        .app-size {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .download-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .download-btn:hover {
            background-color: var(--primary-hover);
        }

        .video-btn {
            background-color: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .video-btn:hover {
            background-color: #ef4444;
            color: #ffffff;
        }

        /* Modal for Video Preview */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 700px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .close-modal {
            position: absolute;
            top: 10px;
            left: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-color);
            cursor: pointer;
            z-index: 10;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Footer */
        footer {
            background-color: var(--header-bg);
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-container {
                padding: 1rem;
            }
            .navbar {
                display: none; /* Can be handled with hamburger menu if needed */
            }
            .hero h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header & Navbar -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo">
                <i class="fa-solid fa-bolt"></i> FreeModX
            </a>
            <ul class="navbar">
                <li><a class="nav-item active" data-i18n="home" onclick="filterCategory('all')">الرئيسية</a></li>
                <li><a class="nav-item" data-i18n="games" onclick="filterCategory('games')">الألعاب</a></li>
                <li><a class="nav-item" data-i18n="programs" onclick="filterCategory('apps')">البرامج</a></li>
                <li><a class="nav-item" data-i18n="configs" onclick="filterCategory('configs')">الكونفجات</a></li>
            </ul>
            <div class="controls">
                <button class="icon-btn" id="langBtn" onclick="toggleLanguage()">
                    <i class="fa-solid fa-globe"></i> <span id="langText">EN</span>
                </button>
                <button class="icon-btn" id="darkModeToggle" title="Dark Mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1 data-i18n="heroModsTitle">ألعاب وكونفجات MOD</h1>
        <p data-i18n="heroModsDesc">كتالوج مجاني لأحدث إصدارات الـ MOD وملفات الـ ESP للعب الاحترافي</p>
    </section>

    <!-- Main Container -->
    <main class="container">
        <div class="section-title">
            <span data-i18n="sectionTitleText">أحدث التحديثات، التعديلات والكونفجات</span>
        </div>

        <!-- Filters -->
        <div class="filters">
            <button class="filter-btn active" data-i18n="filterAll" onclick="filterCategory('all')">الكل</button>
            <button class="filter-btn" data-i18n="filterGames" onclick="filterCategory('games')">الألعاب</button>
            <button class="filter-btn" data-i18n="filterApps" onclick="filterCategory('apps')">البرامج</button>
            <button class="filter-btn" data-i18n="filterConfigs" onclick="filterCategory('configs')">الكونفجات</button>
        </div>

        <!-- Apps Grid -->
        <div class="apps-grid" id="appsGrid">
            <!-- Dynamic Cards Will Be Inserted Here -->
        </div>
    </main>

    <!-- Video Modal Preview -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeVideoModal()">&times;</button>
            <div class="video-container">
                <iframe id="modalIframe" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p data-i18n="footerText">FreeModX © 2026 - تطوير محمد أحمد شوقي</p>
    </footer>

    <!-- Script & Data -->
    <script>
        const appsData = [
            {
                id: "8bp-expert",
                name: "8 Ball Pool Mod",
                category: "games",

                size: "201 MB",
                features: "Extended Guideline, Anti-Ban",
                description: "نسخة مهكرة من لعبة 8 Ball Pool مع خط إرشاد طويل ومميزات حصرية.",
                downloadLink: "https://www.mediafire.com/file/t9e9lwbrncmn1xb/8+Ball+Pool_56.18.2_sign.apk/file",
                videoEmbed: "",
                icon: "https://github.com/momenosama545-rgb/the-freemodx/blob/main/Gemini_Generated_Image_rcabrcabrcabrcab.jpg?raw=true"
            },
            {

                name: "YouTube Music Premium",
                category: "apps",

                features: "Background Play, Ad-Free, High Quality Audio",
                description: "تطبيق يوتيوب ميوزيك النسخة المدفوعة (بريميوم) للاستماع للأغاني والفيديوهات في الخلفية بدون إعلانات وبأعلى جودة صوت.",
                downloadLink: "https://www.mediafire.com/file/7gnde8fxnlbqh8z/YT+Music+v9.36.50+(Premium).apk/file",
                videoEmbed: "",
                icon: "https://github.com/momenosama545-rgb/the-freemodx/blob/main/Gemini_Generated_Image_5fi6h55fi6h55fi6(1).jpg?raw=true"
            },
            {
                id: "pubg",

                version: "1.0",
                size: "5.4 MB",
                features: "ملف صغير جديد آمن علي الايميل الأساسي غير قابل للبيع",
                description: "أضمن ملف لتعزيز الأداء واللعب بدون بان.",
                downloadLink: "https://www.mediafire.com/file/grqpd63av94dpz3/Free+ZoNeX+Mod+1.zip/file",
                videoEmbed: "https://www.youtube.com/embed/B0pi7GawzYg",
                icon: "https://github.com/momenosama545-rgb/the-freemodx/blob/main/images.jpg?raw=true"
            },
            {
                id: "snaptube-pro",
                name: "Snaptube VIP",
                category: "apps",
                version: "7.0.2",
                size: "25 MB",
                features: "Ad-Free, HD Downloads",
                description: "تطبيق لتحميل الفيديوهات والأغاني من يوتيوب ومختلف منصات التواصل الاجتماعي بدون إعلانات.",
                downloadLink: "https://www.mediafire.com/file/m3i6zed01oplulb/Snaptube+v7.66.1.76672501+(Premium).apk/file",
                videoEmbed: "",
                icon: "https://github.com/momenosama545-rgb/the-freemodx/blob/main/Gemini_Generated_Image_nqnk8knqnk8knqnk.jpg?raw=true"
            },
            {
                id: "truecaller-pro",
                name: "Truecaller Gold / Premium",
                category: "apps",
                version: "26.27.5",
                size: "105 MB",
                features: "Caller ID, Spam Blocking, Gold Badge",
                description: "تطبيق تروكولر لمعرفة اسم المتصل، حظر المكالمات المزعجة، وتفعيل مميزات الحساب الذهبي والمدفوع.",
                downloadLink: "https://www.mediafire.com/file/f21oot7692qumni/Truecaller_26.27.5_12627005_3b3b92.apk/file",
                videoEmbed: "",
                icon: "https://github.com/momenosama545-rgb/the-freemodx/blob/main/Gemini_Generated_Image_p8ccjcp8ccjcp8cc.jpg?raw=true"
            }
        ];

        const appsGrid = document.getElementById('appsGrid');
        const darkModeToggle = document.getElementById('darkModeToggle');
        const langText = document.getElementById('langText');
        const htmlRoot = document.getElementById('htmlRoot');
        const videoModal = document.getElementById('videoModal');
        const modalIframe = document.getElementById('modalIframe');

        let currentLang = localStorage.getItem('appLang') || 'ar';

        const translations = {
            en: {
                pageTitle: "FreeModX - Pro Modded APKs, Games & Configs",
                home: "Home",
                games: "Games",
                programs: "Programs",
                configs: "Configs",
                heroModsTitle: "MOD Games & Configs",
                heroModsDesc: "Free catalog of the latest MOD versions and ESP config files for high-end gaming",
                sectionTitleText: "Latest Updates, Mods & Configs",
                filterAll: "All",
                filterGames: "Games",
                filterApps: "Apps",
                filterConfigs: "Configs",
                appVersion: "Version",
                appSize: "Size",
                btnDownload: "Download",
                btnWatch: "Watch",
                footerText: "FreeModX © 2026 - Developed by Mohamed Ahmed Shawky"
            },
            ar: {
                pageTitle: "FreeModX - أفضل تطبيقات، ألعاب وكونفجات معدلة",
                home: "الرئيسية",
                games: "الألعاب",
                programs: "البرامج",
                configs: "الكونفجات",
                heroModsTitle: "ألعاب وكونفجات MOD",
                heroModsDesc: "كتالوج مجاني لأحدث إصدارات الـ MOD وملفات الـ ESP للعب الاحترافي",
                sectionTitleText: "أحدث التحديثات، التعديلات والكونفجات",
                filterAll: "الكل",
                filterGames: "الألعاب",
                filterApps: "البرامج",
                filterConfigs: "الكونفجات",
                appVersion: "الإصدار",
                appSize: "الحجم",
                btnDownload: "تحميل",
                btnWatch: "مشاهدة",
                footerText: "FreeModX © 2026 - تطوير محمد أحمد شوقي"
            }
        };

        function updateLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('appLang', lang);
            langText.innerText = lang.toUpperCase();
            htmlRoot.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            htmlRoot.setAttribute('lang', lang);

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    element.innerText = translations[lang][key];
                }
            });
        }

        function toggleLanguage() {
            const newLang = currentLang === 'ar' ? 'en' : 'ar';
            updateLanguage(newLang);
        }

        function enableDarkMode() {
            document.body.classList.add('dark-mode');
            darkModeToggle.innerHTML = '<i class="fa-solid fa-sun"></i>';
            localStorage.setItem('darkMode', 'enabled');
        }

        function disableDarkMode() {
            document.body.classList.remove('dark-mode');
            darkModeToggle.innerHTML = '<i class="fa-solid fa-moon"></i>';
            localStorage.setItem('darkMode', null);
        }

        if (localStorage.getItem('darkMode') === 'enabled') {
            enableDarkMode();
        }

        darkModeToggle.addEventListener('click', () => {
            if (document.body.classList.contains('dark-mode')) {
                disableDarkMode();
            } else {
                enableDarkMode();
            }
        });

        function generateAppCard(app) {
            const versionText = translations[currentLang].appVersion;
            const sizeText = translations[currentLang].appSize;
            const downloadText = translations[currentLang].btnDownload;
            const watchText = translations[currentLang].btnWatch;

            let videoButtonHtml = '';
            if (app.videoEmbed && app.videoEmbed.trim() !== '') {
                videoButtonHtml = `
                    <button class="video-btn" onclick="openVideoModal('${app.videoEmbed}')">
                        <i class="fa-brands fa-youtube"></i> <span>${watchText}</span>
                    </button>
                `;
            }

            return `
                <div class="app-card" data-category="${app.category}">
                    <div class="app-header">
                        <img src="${app.icon}" alt="${app.name}" class="app-icon">
                        <div class="app-info">
                            <h3>${app.name}</h3>
                            <span class="app-version">${versionText}: ${app.version}</span>
                        </div>
                    </div>
                    <div class="app-features">${app.features}</div>
                    <p class="app-desc">${app.description}</p>
                    <div class="app-footer">
                        <span class="app-size">${sizeText}: ${app.size}</span>
                        <div class="card-actions">
                            <a href="${app.downloadLink}" target="_blank" class="download-btn">${downloadText}</a>
                            ${videoButtonHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        function displayApps(category = 'all') {
            appsGrid.innerHTML = '';
            let filteredApps = appsData;

            if (category !== 'all') {
                filteredApps = appsData.filter(app => app.category === category);
            }

            const fragment = document.createDocumentFragment();
            filteredApps.forEach(app => {
                const cardElement = document.createElement('div');
                cardElement.innerHTML = generateAppCard(app);
                fragment.appendChild(cardElement.firstElementChild);
            });
            appsGrid.appendChild(fragment);
        }

        function filterCategory(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                const onclickAttr = btn.getAttribute('onclick');
                if (onclickAttr && onclickAttr.includes(category)) {
                    btn.classList.add('active');
                }
            });

            document.querySelectorAll('.navbar .nav-item').forEach(link => {
                link.classList.remove('active');
                const onclickAttr = link.getAttribute('onclick');
                if (onclickAttr && onclickAttr.includes(category)) {
                     link.classList.add('active');
                }
            });

            displayApps(category);
        }

        function openVideoModal(embedUrl) {
            modalIframe.src = embedUrl;
            videoModal.style.display = 'flex';
        }

        function closeVideoModal() {
            videoModal.style.display = 'none';
            modalIframe.src = '';
        }

        videoModal.addEventListener('click', (event) => {
            if (event.target === videoModal) {
                closeVideoModal();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            updateLanguage(currentLang);
            displayApps('all');
        });
    </script>
</body>
</html>
